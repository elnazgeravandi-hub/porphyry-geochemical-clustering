[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "porphyry-geochemical-clustering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3", "scikit-learn==1.8.0", "threadpoolctl>=3.5"]
[project.optional-dependencies]
spatial = ["geopandas>=1.0", "shapely>=2.0"]
dbcv = ["hdbscan>=0.8.40"]
test = ["pytest>=8"]
[project.scripts]
porphyry = "porphyry.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
